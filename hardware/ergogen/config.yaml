# FocalPoint Rev A mechanical matrix foundation.
#
# This produces the switch/diode placement, PCB Edge.Cuts, and DXF/SVG outlines
# for a 16-input wireless macropad arranged on a visual 4x4 lattice: encoder
# and joystick in the top corners, touch in the bottom-right corner, and 13
# grid keys in the remaining cells. Its compact, rounded-square hierarchy is inspired by the supplied
# reference. The resulting .kicad_pcb is
# an import/start point; it still needs the nRF52840 module, charger, battery,
# RGB, encoder, joystick, and routing.
#
# Requires Ergogen 4.1+ and KiCad 8 output:
#   npx --yes ergogen@4.1.0 hardware/ergogen -o hardware/ergogen/output

meta:
  engine: 4.1.0
  version: 0.1
  author: FocalPoint contributors

units:
  kx: cx
  ky: cy
  key_gap: 2
  key_pitch: 20
  edge: 5
  # Placement targets for the top control rail, measured from selector
  # slot_1 / row_1 at [0, 0]. Ergogen places the EC11; the joystick center is a
  # mechanical datum until a specific, measured stick part is selected.
  joystick_x: 60
  touch_x: 60
  touch_y: 2 * key_pitch
  encoder_x: 0
  # Ergogen's KiCad coordinate transform flips Y. A negative source-space Y
  # places the controls above row_1 in the generated board.
  control_y: -20

points:
  zones:
    middle_keys:
      # Eight keys fill the two complete middle rows of the visual lattice.
      anchor:
        shift: [0, 0]
      key:
        padding: key_pitch
        spread: key_pitch
        tags: [switch, selector]
      columns:
        col_1: {key: {column_net: C0}}
        col_2: {key: {column_net: C1}}
        col_3: {key: {column_net: C2}}
        col_4: {key: {column_net: C3}}
      rows:
        row_2: {row_net: R1}
        row_3: {row_net: R2}

    top_keys:
      # Two keys occupy the inner top cells between encoder and joystick. The
      # second can use the ceramic cap, but both remain dynamically assignable.
      anchor:
        shift: [key_pitch, control_y]
      key:
        spread: key_pitch
        tags: [switch, top]
      columns:
        clear: {key: {column_net: C1}}
        ceramic: {key: {column_net: C2}}
      rows:
        row_1: {row_net: R0}

    bottom_keys:
      # Three keys fill the bottom row; touch occupies the fourth/right cell.
      anchor:
        shift: [0, 2 * key_pitch]
      key:
        spread: key_pitch
        tags: [switch, bottom]
      columns:
        col_1: {key: {column_net: C0}}
        col_2: {key: {column_net: C1}}
        col_3: {key: {column_net: C2}}
      rows:
        row_4: {row_net: R3}

outlines:
  # Switch cutouts for an optional FR4/laser-cut plate.
  switch_cutouts:
    - what: rectangle
      where: /switch/
      size: [14, 14]

  # 1u keycap envelopes used for fit checks and the case perimeter.
  keycaps:
    - what: rectangle
      where: /switch/
      size: [kx, ky]

  # Switch plate around the key field only. Keep it separate from the outer PCB
  # so the case can place the joystick/encoder in the top rail like the
  # reference image.
  plate:
    - what: outline
      name: keycaps
      expand: 3
      fillet: 4

  # Rounded-square PCB body. It deliberately leaves a 24 mm top rail above the
  # selector field for the joystick at [joystick_x, control_y] and encoder at
  # [encoder_x, control_y]. Add their openings, mounting, and footprints in
  # KiCad/CAD; Ergogen owns the switch matrix and main silhouette.
  pcb:
    - what: rectangle
      where:
        ref: middle_keys_col_2_row_3
        # Centers the complete action-key through control-rail composition,
        # rather than centering only the 4x3 selector grid.
        shift: [10, -9]
      # Includes the EC11 rail plus clearance below the action-row sockets.
      size: [108, 108]
      fillet: 10

  # Board outline actually used for Edge.Cuts: the pcb silhouette minus four
  # Ø10.5 corner relief cutouts for the enclosure's heat-set-insert bosses
  # (WP3-3). The bosses are Ø9 cylinders whose centers sit 1.41 mm diagonal of
  # the 10 mm corner-fillet arc centers (enclosure-local (12,12)/(102,12)/
  # (12,102)/(102,102) = KiCad (-15,-56)/(75,-56)/(-15,34)/(75,34); source
  # space below flips Y). Each subtracted circle lies fully inside the fillet,
  # so it renders as a routed internal cutout (a through-hole the boss passes
  # through) leaving a >=3.3 mm rim of board at the corner. Relief radius
  # 5.25 = boss Ø9/2 + 0.75 mm clearance per side, so a boss never touches
  # board material. Decision: the PCB is switch-hung from the plate (bosses
  # carry only the plate screws, not the PCB) — see case/DESIGN.md.
  pcb_reliefs:
    - what: outline
      name: pcb
    - what: circle
      radius: 5.25
      operation: subtract
      where:
        shift: [-15, 56]
    - what: circle
      radius: 5.25
      operation: subtract
      where:
        shift: [75, 56]
    - what: circle
      radius: 5.25
      operation: subtract
      where:
        shift: [-15, -34]
    - what: circle
      radius: 5.25
      operation: subtract
      where:
        shift: [75, -34]

  # The printed case needs room for a top plate lip and gasket/foam while
  # retaining the reference's soft, compact outer silhouette. Derived from the
  # relief-free pcb silhouette so the case wall stays smooth.
  case_outer:
    - what: outline
      name: pcb
      expand: 3
      fillet: 6

pcbs:
  focalpoint_matrix:
    template: kicad8
    outlines:
      edge_cuts:
        # pcb_reliefs = pcb minus the four boss corner reliefs (WP3-3).
        outline: pcb_reliefs
        layer: Edge.Cuts
    footprints:
      mx_hotswap:
        what: mx
        where: /switch/
        params:
          hotswap: true
          keycaps: true
          reverse: false
          from: "{{colrow}}"
          to: "{{column_net}}"
      diode:
        what: diode
        where: /switch/
        adjust:
          shift: [0, -5]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
      encoder:
        what: rotary
        where:
          ref: middle_keys_col_1_row_2
          shift: [encoder_x, control_y]
        params:
          from: ENC_SW
          to: GND
          A: ENC_A
          B: GND
          C: ENC_B
