# FocalPoint Rev A mechanical matrix foundation.
#
# This produces the switch/diode placement, PCB Edge.Cuts, and DXF/SVG outlines
# for a 16-input wireless macropad: 12 grid keys, one centered command key,
# touch input, analog joystick, and encoder. Its compact, rounded-square visual
# hierarchy is inspired by the supplied reference. The resulting .kicad_pcb is
# an import/start point; it still needs the nRF52840 module, charger, battery,
# RGB, encoder, joystick, and routing.
#
# Requires Ergogen 4.1+ and KiCad 8 output:
#   npx --yes ergogen@4.1.0 hardware/ergogen -o hardware/ergogen/output

meta:
  engine: 4.1.0
  version: 0.1
  author: FocalPoint contributors

units:
  kx: cx
  ky: cy
  key_gap: 2
  key_pitch: 20
  edge: 5
  # Placement targets for the top control rail, measured from selector
  # slot_1 / row_1 at [0, 0]. Ergogen places the EC11; the joystick center is a
  # mechanical datum until a specific, measured stick part is selected.
  joystick_x: 0
  touch_x: 30
  encoder_x: 3 * (kx + key_gap)
  # Ergogen's KiCad coordinate transform flips Y. A negative source-space Y
  # places the controls above row_1 in the generated board.
  control_y: -20

points:
  zones:
    selectors:
      # Twelve transparent MX keys map left-to-right, top-to-bottom to the
      # protocol's user slots 1–12.
      anchor:
        shift: [0, 0]
      key:
        padding: key_pitch
        spread: key_pitch
        tags: [switch, selector]
      columns:
        slot_1: {key: {column_net: C0}}
        slot_2: {key: {column_net: C1}}
        slot_3: {key: {column_net: C2}}
        slot_4: {key: {column_net: C3}}
      rows:
        row_1: {row_net: R0}
        row_2: {row_net: R1}
        row_3: {row_net: R2}

    command:
      # One centered ceramic command key completes the 13-key arrangement.
      # Its behavior is assigned dynamically like every other physical input.
      anchor:
        # Positive source-space Y becomes the bottom row in KiCad. X=30 centers
        # this key under the four-column grid; the 20 mm pitch stays uniform.
        shift: [30, 3 * key_pitch]
      key:
        tags: [switch, command]
      columns:
        center: {key: {column_net: C0}}
      rows:
        command: {row_net: R3}

outlines:
  # Switch cutouts for an optional FR4/laser-cut plate.
  switch_cutouts:
    - what: rectangle
      where: /switch/
      size: [14, 14]

  # 1u keycap envelopes used for fit checks and the case perimeter.
  keycaps:
    - what: rectangle
      where: /switch/
      size: [kx, ky]

  # Switch plate around the key field only. Keep it separate from the outer PCB
  # so the case can place the joystick/encoder in the top rail like the
  # reference image.
  plate:
    - what: outline
      name: keycaps
      expand: 3
      fillet: 4

  # Rounded-square PCB body. It deliberately leaves a 24 mm top rail above the
  # selector field for the joystick at [joystick_x, control_y] and encoder at
  # [encoder_x, control_y]. Add their openings, mounting, and footprints in
  # KiCad/CAD; Ergogen owns the switch matrix and main silhouette.
  pcb:
    - what: rectangle
      where:
        ref: selectors_slot_2_row_2
        # Centers the complete action-key through control-rail composition,
        # rather than centering only the 4x3 selector grid.
        shift: [8.5, 2]
      # Includes the EC11 rail plus clearance below the action-row sockets.
      size: [128, 128]
      fillet: 10

  # The printed case needs room for a top plate lip and gasket/foam while
  # retaining the reference's soft, compact outer silhouette.
  case_outer:
    - what: outline
      name: pcb
      expand: 3
      fillet: 6

pcbs:
  focalpoint_matrix:
    template: kicad8
    outlines:
      edge_cuts:
        outline: pcb
        layer: Edge.Cuts
    footprints:
      mx_hotswap:
        what: mx
        where: /switch/
        params:
          hotswap: true
          keycaps: true
          reverse: false
          from: "{{colrow}}"
          to: "{{column_net}}"
      diode:
        what: diode
        where: /switch/
        adjust:
          shift: [0, -5]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
      encoder:
        what: rotary
        where:
          ref: selectors_slot_1_row_1
          shift: [encoder_x, control_y]
        params:
          from: ENC_SW
          to: GND
          A: ENC_A
          B: GND
          C: ENC_B
