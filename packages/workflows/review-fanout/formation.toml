[formation]
name = "review-fanout"
version = 2
description = "Four independent review lanes and one synthesizer"

[[role]]
name = "synth"
kind = "orchestrator"
type = "synthesizer"

[[role]]
name = "security"
type = "security-reviewer"
prep = "worktree"

[[role]]
name = "perf"
type = "perf-reviewer"
prep = "worktree"

[[role]]
name = "correctness"
type = "correctness-reviewer"
prep = "worktree"

[[role]]
name = "tests"
type = "test-verifier"
prep = "worktree"

[escalate]
channel_kinds = ["blocker"]
states = ["error", "approval"]
completion = "all-roles-done"
