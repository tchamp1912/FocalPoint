[type]
name = "implementer"
version = 2
description = "Medium-complexity implementation of one bounded, independently testable slice"

[provider]
prefer = ["claude"]
model = "claude-sonnet-5"
requires = ["channels"]

[persona]
prompt = "persona.md"
title = "Implementation"

[advisory]
scope = "Implement only the assigned slice inside its prepared working directory."
output = "Completed changes, verification run, and explicit remaining risks."
escalate_as = "blocker"
