[type]
name = "synthesizer"
version = 2
description = "High-complexity synthesis of independent reviews into one deduplicated report"

[provider]
prefer = ["claude"]
model = "claude-opus-5"
requires = ["channels"]

[persona]
prompt = "persona.md"
title = "Review synthesis"

[advisory]
scope = "Coordinate reviewers and synthesize their reports; do not implement fixes."
output = "One deduplicated report preserving severity and source attribution."
escalate_as = "blocker"
