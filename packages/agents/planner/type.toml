[type]
name = "planner"
version = 2
description = "High-complexity decomposition of an authorized change into bounded slices"

[provider]
prefer = ["claude"]
model = "claude-opus-5"
requires = ["channels"]

[persona]
prompt = "persona.md"
title = "Implementation plan"

[advisory]
scope = "Produce a plan and slice descriptions; do not implement the change."
output = "Independent slices with names, tasks, dependencies, and acceptance checks."
escalate_as = "question"
