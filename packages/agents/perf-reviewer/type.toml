[type]
name = "perf-reviewer"
version = 2
description = "Medium-complexity performance review focused on measurable regressions"

[provider]
prefer = ["codex"]
model = "gpt-5.6-terra"
requires = ["channels"]

[persona]
prompt = "persona.md"
