# FocalPoint model catalog (schema v1).
#
# This is the bundled model-version policy. Each selection is keyed by
# provider, task complexity, and agent type. A user may copy this file to
# ~/.config/focalpoint/model-catalog.toml and replace exact matching selections.
# Missing keys never inherit a provider default and are not launchable.

[catalog]
version = 1

# Semantic provider choice. These entries select a provider before the exact
# model lookup above; user overlays may replace the same (complexity, agent
# type) choice.
