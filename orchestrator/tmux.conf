# FocalPoint "invisible" tmux config
#
# Used only by managed sessions: a tmux pane FocalPoint can drive via
# `tmux send-keys`
# (precise, background, no Accessibility permission) and focus via
# `tmux select-window` (no AppleScript/window-server raise needed). The goal
# of every setting below is that a managed session *looks and feels as close
# to a plain terminal as possible* — the user should not be able to tell
# they're inside tmux unless they go looking. Loaded explicitly via
# `tmux -f <this file>` by orchestrator/focalpoint-run.sh; it is never merged
# with the user's own ~/.tmux.conf, so it must be self-contained.
#
# HONEST CAVEAT: this is a private, best-effort mux config. tmux version
# differences can make individual options no-ops on older tmux; every option
# here degrades harmlessly (worst case: slightly less invisible, never a
# crash) if unsupported.

# No status bar — the single biggest tell that you're in tmux. FocalPoint's
# own UI (the pad/app) is the "session list"; tmux doesn't need to duplicate
# it inline in the terminal.
set -g status off

# Let the mouse behave like a normal terminal (click to position cursor,
# scroll to scroll, drag to select/resize panes) instead of tmux's
# copy-mode-only default. Without this, scrolling with a trackpad/wheel
# enters copy mode and feels broken to anyone not already a tmux user.
set -g mouse on

# Tell tmux (and everything running inside it) that the outer terminal is
# 256-color-capable, so apps that probe TERM still get sensible color
# fallbacks even if truecolor negotiation below fails for some reason.
set -g default-terminal "tmux-256color"

# Truecolor (24-bit RGB) passthrough — without this, tmux clamps color
# output to a 256-color palette even when the real terminal (iTerm2,
# Terminal.app w/ 256-color profile, etc.) supports full RGB, which is
# visibly different for any agent CLI doing its own syntax highlighting.
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB"

# Large scrollback so a long agent run doesn't truncate output a user might
# want to scroll back and read — plain terminals default to effectively
# unlimited/very large buffers, so a small tmux default would be a
# regression from the unmanaged experience.
set -g history-limit 100000

# Rename windows to whatever's actually running instead of tmux's generic
# numbered default — keeps window titles legible if a user does open the
# status bar or list-windows for debugging.
set -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#T"

# Keep tmux's own escape-time low so keypresses (e.g. plain Escape in a
# TUI-ish agent CLI) feel native instead of laggy — tmux's historic default
# (500ms) exists for nested-terminal detection and is noticeable lag for
# anything Vim-like.
set -sg escape-time 10

# Focus events (focus-in/focus-out) passed through to the running program,
# so apps that redraw/dim on focus change (many TUIs) still behave
# correctly inside the pane.
set -g focus-events on

# No visual/audible bell decoration — stay quiet and out of the way like a
# plain terminal; FocalPoint's own state signaling (the pad/app) is the
# notification channel, not a beeping terminal multiplexer.
set -g visual-bell off
set -g bell-action none

# Straight to the shell/command's own exit; don't leave a dead pane sitting
# around with a "[exited]" placeholder the way tmux does by default, which
# would look broken compared to a plain terminal window just closing.
set -g remain-on-exit off
